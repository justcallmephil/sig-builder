<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grace Signature Builder</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <aside class="editor">

        <img
            src="assets/logo-default.png"
            alt="Grace Chapel"
            class="brand-logo"
			width="240px">
		<br><br>

        <h1>Email Signature Builder</h1>

        <p class="subtitle">
            Create a standardized Grace Chapel email signature.
        </p>

        <label>
            Name
            <input id="name" type="text">
        </label>

        <label>
            Job Title
            <input id="title" type="text">
        </label>

        <label>
            Primary Phone
            <input id="phone1" type="text">
        </label>

        <label>
            Secondary Phone
            <input id="phone2" type="text">
        </label>

        <div class="button-group">

            <button disabled>
                Copy for Outlook
            </button>

            <button disabled>
                Download HTML
            </button>

            <button id="reset">
                Reset
            </button>

        </div>

    </aside>

    <main class="preview">

        <h2>Live Preview</h2>

        <div class="preview-card">

            <div id="signature-preview"></div>

        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
