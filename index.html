<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Grace Signature Builder</title>

    <meta
        name="description"
        content="Generate standardized Grace Chapel email signatures.">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- =======================================================
             Sidebar
        ======================================================== -->

        <aside class="sidebar">

            <header class="sidebar-header">

                <h1>Grace Signature Builder</h1>

                <p>
                    Create a standardized email signature for
                    Grace Chapel staff.
                </p>

            </header>

            <form id="signature-form">

                <div class="field">

                    <label for="name">
                        Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Phil Davis"
                        autocomplete="name">

                </div>

                <div class="field">

                    <label for="title">
                        Job Title
                    </label>

                    <input
                        id="title"
                        type="text"
                        placeholder="Graphic Designer">

                </div>

                <div class="field">

                    <label for="phone1">
                        Primary Phone
                    </label>

                    <input
                        id="phone1"
                        type="text"
                        placeholder="339-970-2301">

                </div>

                <div class="field">

                    <label for="phone2">
                        Secondary Phone
                    </label>

                    <input
                        id="phone2"
                        type="text"
                        placeholder="Optional">

                </div>
<div class="field checkbox-field">

    <label class="checkbox-label">

        <input
            id="includeApp"
            type="checkbox"
            checked>

        <span>Include "Download our app: GC Connect"</span>

    </label>

</div>
            </form>

            <div class="button-bar">

                <button
                    id="copy-button"
                    type="button">

                    Copy for Outlook

                </button>

                <button
                    id="download-button"
                    type="button"
                    disabled>

                    Download HTML

                </button>

                <button
                    id="reset-button"
                    type="button">

                    Reset

                </button>

            </div>

            <footer class="sidebar-footer">

                Grace Signature Builder
                <span id="version">
                    v0.2
                </span>

            </footer>

        </aside>

        <!-- =======================================================
             Preview
        ======================================================== -->

        <main class="preview">

            <div class="preview-header">

    <h2>Live Preview</h2>

    <label class="switch">

    <span>Light</span>

    <input
        id="darkPreview"
        type="checkbox">

    <span class="slider"></span>

    <span>Dark</span>

</label>

</div>

           <div id="preview-canvas" class="preview-canvas">

    <section
        id="signature-preview"
        class="preview-card">
    </section>

</div>

        </main>

    </div>

    <script type="module" src="main.js"></script>

    <div id="toast" class="toast">
    ✓ Signature copied!<br>
    Open Outlook → Settings → Signatures and paste.
</div>

</body>
</html>
